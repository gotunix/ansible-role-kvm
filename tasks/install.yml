---
- name: Ensure KVM and required packages are installed (Debian/Ubuntu)
  apt:
    name: "{{ kvm_packages }}"
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"



- name: Start and enable libvirtd service
  service:
    name: libvirtd
    state: started
    enabled: yes

- name: Ensure libvirt network is active and autostarted
  community.libvirt.virt_net:
    name: "{{ kvm_network_name }}"
    state: active
    autostart: yes
  when: kvm_network_type == "network"
